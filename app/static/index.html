<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发动机 CAE 仿真 RAG</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel2: #273449;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
      --border: #334155; --ok: #4ade80; --err: #f87171;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 22px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; background: var(--panel); }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .badge { font-size: 12px; color: var(--muted); }
    header .stats { margin-left: auto; font-size: 12px; color: var(--muted); }
    .drop { display: none; }
    .drop.visible { display: block; padding: 8px 22px; background: var(--panel2);
      border-bottom: 1px dashed var(--border); }
    .drop input[type=file] { color: var(--muted); }
    .drop button, .toolbar button { background: var(--accent); color: #06222f; border: 0;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .drop button:hover, .toolbar button:hover { filter: brightness(1.1); }
    main { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 860px; width: 100%; }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap;
      word-break: break-word; }
    .user .bubble { background: var(--accent); color: #06222f; border-bottom-right-radius: 2px; }
    .assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-top-left-radius: 2px; }
    .sources { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .sources .src { display: block; padding: 6px 10px; background: var(--panel2); border-radius: 6px;
      margin-top: 4px; cursor: pointer; }
    .sources .src:hover { border: 1px solid var(--accent); }
    .sources .src .loc { color: var(--accent); font-weight: 600; }
    .loading { color: var(--muted); font-style: italic; }
    footer { padding: 14px 22px; border-top: 1px solid var(--border); background: var(--panel); }
    .toolbar { display: flex; gap: 10px; margin-bottom: 10px; }
    .toolbar button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
    .inputrow { display: flex; gap: 10px; }
    textarea { flex: 1; resize: none; background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px;
      min-height: 44px; max-height: 160px; }
    textarea:focus { outline: none; border-color: var(--accent); }
    .inputrow button { background: var(--accent); color: #06222f; border: 0; border-radius: 8px;
      padding: 0 20px; font-weight: 600; cursor: pointer; }
    .toast { position: fixed; bottom: 90px; right: 24px; background: var(--panel2);
      border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>🔧 发动机 CAE 仿真 RAG</h1>
    <span class="badge">文档检索问答 · Word/PDF/PPT/TXT</span>
    <span class="stats" id="stats">…</span>
  </header>

  <div class="drop" id="drop">
    <input type="file" id="fileInput" multiple accept=".docx,.pdf,.pptx,.txt,.md" />
    <button onclick="uploadFiles()">导入所选文档</button>
    <span id="uploadMsg" style="font-size:12px;color:var(--muted)"></span>
  </div>

  <main id="chat"></main>

  <footer>
    <div class="toolbar">
      <button id="btnUpload" class="ghost">📁 导入文档</button>
      <button id="btnClear" class="ghost">清空对话</button>
    </div>
    <div class="inputrow">
      <textarea id="input" placeholder="例如:缸盖热应力的边界条件怎么设置?高周疲劳分析用什么判据?" rows="1"></textarea>
      <button onclick="ask()">发送</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const statsEl = document.getElementById('stats');

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function addMsg(role, html) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = html;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function sourcesHtml(sources) {
      if (!sources || !sources.length) return '';
      let h = '<div class="sources">参考来源:';
      sources.forEach(s => {
        const loc = s.source + (s.page ? ' 第' + s.page + '页' : '') + (s.section ? ' · ' + s.section : '');
        h += `<span class="src" title="${esc(s.text)}"><span class="loc">[${s.index}] ${esc(loc)}</span> · 相似度 ${s.score}</span>`;
      });
      return h + '</div>';
    }

    function toast(t) {
      const el = document.getElementById('toast');
      el.textContent = t; el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    async function ask() {
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      addMsg('user', `<div class="bubble">${esc(q)}</div>`);
      const loading = addMsg('assistant', '<div class="bubble loading">检索中…</div>');
      try {
        const r = await fetch('/api/query', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question: q})
        });
        const data = await r.json();
        loading.remove();
        addMsg('assistant', `<div class="bubble">${esc(data.answer)}</div>` + sourcesHtml(data.sources));
      } catch (e) {
        loading.innerHTML = `<div class="bubble" style="color:var(--err)">请求失败:${esc(e)}</div>`;
      }
    }

    async function uploadFiles() {
      const fi = document.getElementById('fileInput');
      if (!fi.files.length) { toast('请先选择文件'); return; }
      const fd = new FormData();
      for (const f of fi.files) fd.append('files', f);
      const msg = document.getElementById('uploadMsg');
      msg.textContent = '导入中…';
      try {
        const r = await fetch('/api/ingest', {method: 'POST', body: fd});
        const data = await r.json();
        msg.textContent = `完成:导入 ${data.imported?.length || 0} 个,共 ${data.total_chunks || 0} 块` +
          (data.errors?.length ? `,${data.errors.length} 个失败` : '');
        fi.value = '';
        refreshStats();
      } catch (e) {
        msg.textContent = '导入失败:' + e;
      }
    }

    async function refreshStats() {
      try {
        const r = await fetch('/api/health');
        const d = await r.json();
        statsEl.textContent = `已索引 ${d.stats.count} 个片段`;
      } catch (e) { statsEl.textContent = ''; }
    }

    document.getElementById('btnUpload').onclick = () => {
      const d = document.getElementById('drop');
      d.classList.toggle('visible');
    };
    document.getElementById('btnClear').onclick = () => { chat.innerHTML = ''; };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    });

    refreshStats();
  </script>
</body>
</html>
